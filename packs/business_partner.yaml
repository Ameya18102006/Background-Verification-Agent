# Check pack: doing a business deal with a person (co-founder, partner, investor, distributor).
# Uses BOTH bases: the person is the subject (identity gate), their company is checked too.
# For partnerships, links to failed ventures matter as much as legal trouble: Tier 1.
name: business_partner
label: Business deal with a person
subject: person
extends: [base_person, base_company]
description: Before partnering, co-founding, investing with or signing a deal with an
  individual, check their track record and their company's health.

inputs:
  - {key: company, label: "Their company", required: false}
  - {key: domain, label: "Company website domain (optional), e.g. acme.com"}
  - {key: claims, label: "What they told you (optional)", type: text}

checks:
  # The company is secondary here: not the gate, and a Tier 2 signal.
  - {id: company, gate: false, tier: 2, label: "Their company's status and health",
     params: {name: "{company|person.current_company}", domain: "{domain}"}}
  - id: regulatory
    label: Regulator orders (SEBI)
    tool: web_search
    params:
      queries:
        - {q: '"{person.name|name}"', site: sebi.gov.in, category: regulatory}
        - {q: '"{company.name|company}"', site: sebi.gov.in, category: regulatory}

red_flags:
  - {id: regulatory_action, tier: 1, description: "Regulator orders, penalties or bans (SEBI etc.)"}
  - {id: failed_ventures, tier: 1, description: "Companies they led have deleted pages, collapsed headcount or shut down"}
  - {id: shrinking, tier: 2, description: "Their company's headcount dropped sharply from its peak"}
  - {id: funding_stall, tier: 3, description: "No funding for a long time while headcount falls"}

not_checked:
  - Personal credit, debts and tax liens

demo:
  name: Byju Raveendran
  company: BYJU'S
  domain: byjus.com
